name: Token Guardian documentation
description: Report missing, incorrect, or unclear setup and usage instructions
title: "[docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or page
      placeholder: e.g. README.md or guardian-server/README.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
      description: Quote the relevant text or describe the step you could not complete. Omit private paths, credentials, and conversation content.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement (optional)
    validations:
      required: false
