name: Token Guardian bug
description: Report a reproducible problem with usage tracking, investigations, or the companion
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Token Guardian. Check [existing Guardian issues](https://github.com/JunyiZhou-Conny/token-guardian/issues) before filing. This issue is public.
        Share only anonymized usage metadata. Remove API keys, cookies, access tokens, prompts, conversation text, account identifiers, and private paths from screenshots or examples.

  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Include whether you were viewing local data or the labeled demo.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Token Guardian.
        2. Open Investigations or import anonymized usage metadata.
        3. Describe the unexpected result.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Guardian version or Git commit
      description: Include the application version or the commit you checked out.
      placeholder: e.g. a short Git commit SHA
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and runtime
      description: Operating system, browser, and Node.js version if running from source.
      placeholder: e.g. macOS 15, Safari 18, Node.js 24
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Affected usage source
      options:
        - Cursor
        - Codex / OpenAI
        - Claude
        - Gemini
        - Demo data
        - Multiple sources / interface
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Anonymized evidence (optional)
      description: A minimal synthetic or anonymized record, error message, or screenshot. Include timestamps, token counts, and whether cost is estimated, included, or charged when relevant. Do not upload raw conversations or credentials.
    validations:
      required: false
