name: Token Guardian idea
description: Suggest an improvement to tracking, investigations, the companion, or collections
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem and who would benefit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: Describe the expected behavior or attach a mockup. Keep examples free of credentials, prompts, and private usage records.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Usage source / import
        - Investigation / alerts
        - Companion chat
        - Champions / collectibles
        - macOS experience
        - Accessibility / interface
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround (optional)
      description: Explain how you handle the problem today.
    validations:
      required: false
